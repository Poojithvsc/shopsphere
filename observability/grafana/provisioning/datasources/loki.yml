# Auto-provisions Loki as a second Grafana datasource on startup (Phase 18b). Prometheus (Phase 18a)
# stays the default; this adds logs alongside metrics so one Grafana explores both.
apiVersion: 1

datasources:
  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://loki:3100
    isDefault: false
    editable: false
