# Local-development stack for ShopSphere.
#
# Two ways to run:
#
#   # Dev — fast inner loop, JVM on host
#   docker compose up -d                              # Postgres + Kafka only
#   mvn spring-boot:run                               # app on the host
#
#   # Prod-parity — everything containerised
#   docker compose --profile full up -d --build      # Postgres + Kafka + app
#
#   docker compose down         # stop (keeps the pg volume)
#   docker compose down -v      # stop and wipe the database
#
# The `app` service is gated behind the `full` profile so the dev workflow is
# unchanged — `docker compose up -d` continues to bring up only the backing
# services Postgres + Kafka, exactly as it did before Phase 10.
#
# Image versions are pinned to match the Testcontainers setup in
# src/test/java/com/shopsphere/SharedContainers.java so local runs and CI
# exercise the same Postgres/Kafka versions.

services:
  postgres:
    image: postgres:16
    container_name: shopsphere-postgres
    environment:
      POSTGRES_DB: shopsphere
      POSTGRES_USER: shopsphere
      POSTGRES_PASSWORD: shopsphere
    ports:
      - "5432:5432"
    volumes:
      - shopsphere-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shopsphere -d shopsphere"]
      interval: 5s
      timeout: 5s
      retries: 10

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: shopsphere-kafka
    ports:
      # Host clients (the app via `mvn spring-boot:run`) connect here.
      - "9092:9092"
    environment:
      # --- KRaft single-node (no ZooKeeper) ---
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      # Two broker listeners: PLAINTEXT for in-cluster traffic, PLAINTEXT_HOST
      # advertised as localhost so a process on the host can reach the broker.
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:9093,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      # Single-node replication factors.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # Fixed cluster id so the KRaft metadata log survives restarts.
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092 >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 15

  localstack:
    image: localstack/localstack:3.8
    container_name: shopsphere-localstack
    ports:
      # S3 (and other AWS APIs) on the edge port. Presigned URLs are signed against
      # HOSTNAME_EXTERNAL=localhost so a link opened in your browser actually resolves.
      - "4566:4566"
    environment:
      SERVICES: s3
      # Enforce presigned-URL signatures/expiry (LocalStack skips this by default), matching
      # real S3 and the test setup in SharedContainers.
      S3_SKIP_SIGNATURE_VALIDATION: "0"
    volumes:
      # Creates the product-image bucket on startup (see scripts/localstack-init.sh).
      - ./scripts/localstack-init.sh:/etc/localstack/init/ready.d/init.sh
    healthcheck:
      test: ["CMD-SHELL", "awslocal s3 ls s3://shopsphere-product-images >/dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 15

  app:
    # Only started with `docker compose --profile full up -d --build`.
    profiles: ["full"]
    build:
      context: .
    container_name: shopsphere-app
    image: shopsphere:latest
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      localstack:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: shopsphere
      DB_USER: shopsphere
      DB_PASSWORD: shopsphere
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      JWT_SECRET: dev-only-secret-change-me-32-bytes-minimum-aaaa
      # Storage seam: the containerised app reaches LocalStack by service name. NOTE: presigned URLs
      # are signed against this endpoint, so under the `full` profile they read `localstack:4566` —
      # resolvable inside the compose network but not from a host browser. The primary dev loop
      # (app on the host via `mvn spring-boot:run`, S3_ENDPOINT defaulting to localhost:4566) mints
      # host-openable URLs. Real S3 has no such split. See ADR-0016.
      S3_ENDPOINT: http://localstack:4566
      S3_BUCKET: shopsphere-product-images
      AWS_REGION: us-east-1
      S3_ACCESS_KEY: test
      S3_SECRET_KEY: test
    ports:
      - "8080:8080"

  prometheus:
    # Observability stack — only with the `full` profile (it scrapes the containerised app).
    profiles: ["full"]
    image: prom/prometheus:v2.54.1
    container_name: shopsphere-prometheus
    depends_on:
      app:
        condition: service_started
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"

  grafana:
    profiles: ["full"]
    image: grafana/grafana:11.2.0
    container_name: shopsphere-grafana
    depends_on:
      prometheus:
        condition: service_started
    environment:
      # Default admin/admin. GF_SECURITY_ADMIN_PASSWORD is intentionally NOT set so Grafana keeps
      # its built-in "change password on first login" prompt (the AC). Rotate before any real use.
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "3000:3000"

  loki:
    # Log aggregation — single-binary, filesystem storage (Phase 18b). Grafana queries it as a
    # second data source; promtail (below) feeds it. `full` profile because it stores the
    # containerised app's logs, like the rest of the observability stack.
    profiles: ["full"]
    image: grafana/loki:3.1.1
    container_name: shopsphere-loki
    command: ["-config.file=/etc/loki/loki-config.yml"]
    volumes:
      - ./observability/loki/loki-config.yml:/etc/loki/loki-config.yml:ro
    ports:
      - "3100:3100"

  promtail:
    # Tails the app container's stdout JSON logs and ships them to Loki (Phase 18b). Reads the
    # Docker socket to discover the `shopsphere-app` container; no app code or logging change needed.
    profiles: ["full"]
    image: grafana/promtail:3.1.1
    container_name: shopsphere-promtail
    command: ["-config.file=/etc/promtail/promtail-config.yml"]
    depends_on:
      loki:
        condition: service_started
    volumes:
      - ./observability/promtail/promtail-config.yml:/etc/promtail/promtail-config.yml:ro
      # Promtail discovers containers and reads their JSON logs via the Docker engine API.
      - /var/run/docker.sock:/var/run/docker.sock

  kafka-ui:
    # Browse topics, partitions, and consumer-group offsets at http://localhost:8081 (Phase 18b).
    # Needs only the broker, but stays under `full` so `docker compose up -d` keeps the dev loop
    # minimal (Postgres + Kafka), consistent with how the app and metrics stack are gated.
    profiles: ["full"]
    image: kafbat/kafka-ui:v1.0.0
    container_name: shopsphere-kafka-ui
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_CLUSTERS_0_NAME: shopsphere
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      DYNAMIC_CONFIG_ENABLED: "true"
    ports:
      - "8081:8080"

  caddy:
    # Phase 20 — HTTPS reverse proxy in front of the app, self-signed via `tls internal`. Under the
    # `full` profile so a local `docker compose --profile full up -d` lets you prove TLS works:
    # `curl -k https://localhost/actuator/health` reaches the app. The same Caddyfile fronts the EC2
    # in the cloud deploy (compose.cloud.yml). See ADR-0020.
    profiles: ["full"]
    image: caddy:2.8
    container_name: shopsphere-caddy
    depends_on:
      app:
        condition: service_started
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    ports:
      - "443:443"

volumes:
  shopsphere-pgdata:
  caddy-data:
