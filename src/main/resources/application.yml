spring:
  application:
    name: shopsphere
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:shopsphere}
    username: ${DB_USER:shopsphere}
    password: ${DB_PASSWORD:shopsphere}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: catalog
  data:
    web:
      pageable:
        default-page-size: 20
        # Oversized ?size= requests are clamped to this rather than rejected (see ADR-0017).
        max-page-size: 100
  flyway:
    enabled: true
    default-schema: catalog
    schemas: catalog,identity,ordering,payment
    create-schemas: true
    locations: classpath:db/migration/catalog,classpath:db/migration/identity,classpath:db/migration/ordering,classpath:db/migration/payment
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: earliest
  modulith:
    events:
      externalization:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,modulith
  endpoint:
    health:
      show-details: always
  info:
    git:
      mode: full
    build:
      enabled: true

server:
  port: 8080

shopsphere:
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-change-me-32-bytes-minimum-aaaa}
    ttl: PT15M
  refresh:
    ttl: P7D
  storage:
    s3:
      # The dev↔cloud seam (mirrors the ${DB_HOST} pattern): LocalStack endpoint by default; set
      # S3_ENDPOINT empty in cloud so the SDK resolves real S3. Credentials are blank here so the
      # default AWS provider chain (instance profile) is used unless S3_ACCESS_KEY/S3_SECRET_KEY set.
      endpoint: ${S3_ENDPOINT:http://localhost:4566}
      bucket: ${S3_BUCKET:shopsphere-product-images}
      region: ${AWS_REGION:us-east-1}
      access-key: ${S3_ACCESS_KEY:}
      secret-key: ${S3_SECRET_KEY:}
  ordering:
    idempotency:
      # Delete idempotency claims older than this. Must outlast any legitimate client-retry window;
      # 24h is a wide margin over the seconds-to-minutes a real retry takes (#73, ADR-0014).
      ttl: PT24H
      # How often the retention sweep runs (fixed delay between completions).
      sweep-interval: PT1H
