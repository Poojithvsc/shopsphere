spring:
  application:
    name: shopsphere
  datasource:
    url: jdbc:postgresql://localhost:5432/shopsphere
    username: shopsphere
    password: shopsphere
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: catalog
  flyway:
    enabled: true
    default-schema: catalog
    schemas: catalog,identity,ordering,payment
    create-schemas: true
    locations: classpath:db/migration/catalog,classpath:db/migration/identity,classpath:db/migration/ordering,classpath:db/migration/payment
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: earliest
  modulith:
    events:
      externalization:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,modulith
  endpoint:
    health:
      show-details: always
  info:
    git:
      mode: full
    build:
      enabled: true

server:
  port: 8080

shopsphere:
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-change-me-32-bytes-minimum-aaaa}
    ttl: PT15M
  refresh:
    ttl: P7D
