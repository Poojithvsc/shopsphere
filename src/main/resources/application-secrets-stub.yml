# =============================================================================
# application-secrets-stub.yml  —  INERT DOCUMENTATION, NOT ACTIVE CONFIG
# =============================================================================
# This file is bound to the Spring profile `secrets-stub`, which NOTHING
# activates. It contributes no properties at runtime and changes no behaviour;
# `mvn verify` stays green precisely because it never loads.
#
# Its only job is to record — in the tree, where the next engineer will look —
# what the AWS Parameter Store integration will look like once the project
# moves to its own AWS account. See ADR-0013 for the full rationale.
#
# WHY THIS IS NOT WIRED UP YET
# ----------------------------
# Whizlabs sandbox sessions block `ssm:GetParameter` and the IAM
# instance-profile machinery with AccessDenied, so the integration cannot run
# there. Graduation trigger: arrival of an own AWS account.
#
# WHAT TO DO ON OWN-AWS (turn the comments below into real config)
# ----------------------------------------------------------------
# 1. Add the dependency to pom.xml:
#        io.awspring.cloud:spring-cloud-aws-starter-parameter-store
#
# 2. Create the SecureString parameters (KMS-encrypted) under the prefix:
#        /shopsphere/<env>/jwt-secret
#        /shopsphere/<env>/db-password
#
# 3. Grant the EC2 instance profile, scoped to the prefix only:
#        ssm:GetParameter, ssm:GetParametersByPath
#          on  arn:aws:ssm:<region>:<acct>:parameter/shopsphere/<env>/*
#        kms:Decrypt
#          on  the customer-managed key that encrypts those parameters
#
# 4. Import the parameters at boot — they become ordinary Environment
#    properties BEFORE the context refreshes, so the existing
#    ${JWT_SECRET} / ${DB_PASSWORD} placeholders in application.yml resolve
#    from here instead of from the shell. The placeholders DO NOT CHANGE.
#
#    spring:
#      config:
#        import: "aws-parameterstore:/shopsphere/${ENV}/"
#      cloud:
#        aws:
#          region:
#            static: us-east-1
#          parameterstore:
#            # map /shopsphere/<env>/jwt-secret -> property jwt-secret, etc.
#            prefix: /shopsphere/${ENV}
#
# 5. Switch to Secrets Manager instead ONLY if/when automatic rotation is
#    wanted (use spring-cloud-aws-starter-secrets-manager); the import
#    mechanism is the same, so it is a property-source swap, not a rewrite.
#
# Nothing below this line is real. The single key exists only so this file is
# valid YAML bound to an unused profile.
# =============================================================================
shopsphere:
  secrets-stub:
    active: false   # inert marker — see comments above; no code reads this
